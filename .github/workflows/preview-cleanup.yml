# A pull request's preview is a Worker of its own, tic-tac-toe-ultra-pr-<number> (see ci.yml). It
# goes when the pull request is closed, merged or not, so that previews don't pile up on the account.
name: Preview cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete the preview
    # Pull requests from forks never got a preview: they can't use the secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: tic-tac-toe-ultra-pr-${{ github.event.pull_request.number }}
    steps:
      - name: Check the one-time setup
        id: setup
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Cleanup skipped::The Cloudflare secrets are missing; see README.md, One-time setup."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.setup.outputs.ready == 'true'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.setup.outputs.ready == 'true'
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - if: steps.setup.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      # A pull request without a preview (a draft, or one that never deployed) has no Worker to delete.
      - name: Delete the Worker
        if: steps.setup.outputs.ready == 'true'
        run: |
          if pnpm exec wrangler delete --name "$WORKER" --force; then
            echo "Deleted $WORKER" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=Nothing to delete::$WORKER doesn't exist, or couldn't be deleted."
          fi
