# Checks every pull request, then deploys to Cloudflare Pages: a preview per pull request, production
# for main. See README.md for the one-time setup the deploy needs; until it is done the deploy is
# skipped with a notice and the checks still run.
#
# The repository is public, so Actions minutes are free and every pull request runs everything.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Pull requests are squash-merged with their title as the commit message, so the title follows
      # Conventional Commits too. It is the first step, so that a bad title fails before anything is
      # installed. It asks GitHub for the title as it is now, so re-running this job after fixing
      # the title passes. .github/workflows/pr-title.yml checks it again when someone edits it, with
      # the same pattern: keep the two in sync.
      - name: Conventional Commits title
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          title=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .title)
          pattern='^(feat|fix|refactor|perf|test|docs|style|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ].*$'
          if ! printf '%s' "$title" | grep -Eq "$pattern"; then
            echo "::error title=Pull request title::\"$title\" isn't a Conventional Commits title, like \"feat(app): add the board\"."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
      # The deploy puts exactly the app that was built and tested here on Cloudflare.
      - name: Keep the build for the deploy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy
    needs: checks
    # Not for a draft, and not for pull requests from forks: they can't use the secrets.
    if: ${{ github.event.pull_request.draft != true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: deploy-${{ github.event.pull_request.number || 'production' }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Check the one-time setup
        id: setup
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Deploy skipped::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets; see README.md, One-time setup."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.setup.outputs.ready == 'true'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.setup.outputs.ready == 'true'
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - if: steps.setup.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Get the tested build
        if: steps.setup.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.setup.outputs.ready == 'true'
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          pnpm exec wrangler pages deploy dist --project-name tic-tac-toe-ultra --branch "$BRANCH" --commit-hash "$COMMIT"
          url=$(jq -r 'select(.type == "pages-deploy-detailed") | .alias // .url' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
      # Cloudflare needs a moment to serve a new deployment, hence the tries. The deploy of main is
      # not tested again, so this is what shows that the page is up.
      - name: Check that the page answers
        if: steps.setup.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --max-time 20 "$URL/" | grep -q '<div id="root">'; then
              echo "The page answers: $URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "The page doesn't answer yet (try $attempt of 6)"
            sleep 10
          done
          echo "::error title=The page doesn't answer::$URL fails after the deploy"
          exit 1
      - name: Put the preview address on the pull request
        if: steps.setup.outputs.ready == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- tic-tac-toe-ultra-preview -->'
          body="$marker
          **Preview:** $URL

          Built from ${COMMIT::7}."
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi
